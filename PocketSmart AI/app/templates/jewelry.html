{% extends 'base.html' %}

{% block title %}
Jewelry Planner
{% endblock %}


{% block content %}

<div class="page-head">

    <span class="pill">
        Jewelry Planner
    </span>

    <h1>
        Find a look within your budget
    </h1>

</div>


<div class="form-card">

    <form
        id="jewelryForm"
        enctype="multipart/form-data"
    >

        <label>
            Budget (₹)

            <input
                type="number"
                name="budget"
                min="1"
                required
            >
        </label>


        <label>
            Occasion

            <input
                name="occasion"
                placeholder="Wedding, festival, party..."
                required
            >
        </label>


        <label>
            Style

            <select name="style">

                <option>
                    Elegant
                </option>

                <option>
                    Minimal
                </option>

                <option>
                    Traditional
                </option>

                <option>
                    Statement
                </option>

            </select>

        </label>


        <label>
            Outfit color

            <input
                name="outfit_color"
                placeholder="Optional"
            >
        </label>


        <label>

            Notes

            <textarea
                name="notes"
            ></textarea>

        </label>


        <label>

            Outfit image

            <input
                type="file"
                name="image"
                accept="image/*"
            >

        </label>


        <button class="btn">
            Generate Recommendations
        </button>


        <p id="msg"></p>

    </form>

</div>


<div
    id="output"
    class="results"
></div>

{% endblock %}
