{% extends 'base.html' %}

{% block title %}
Party Planner
{% endblock %}


{% block content %}

<div class="page-head">

    <span class="pill">
        Party Planner
    </span>

    <h1>
        Build a party budget that works
    </h1>

</div>


<div class="form-card">

    <form id="partyForm">

        <label>
            Budget (₹)

            <input
                type="number"
                name="budget"
                min="1"
                required
            >
        </label>


        <label>
            Event type

            <input
                name="event_type"
                placeholder="Birthday, wedding, corporate..."
                required
            >
        </label>


        <label>
            Guests

            <input
                type="number"
                name="guests"
                min="1"
                required
            >
        </label>


        <label>
            Venue

            <input
                name="venue"
                value="home"
            >
        </label>


        <label>
            City

            <input
                name="city"
                placeholder="Optional"
            >
        </label>


        <label>
            Food preference

            <input
                name="food_preference"
                value="mixed"
            >
        </label>


        <button class="btn">
            Generate Recommendations
        </button>


        <p id="msg"></p>

    </form>

</div>


<div
    id="output"
    class="results"
></div>

{% endblock %}
